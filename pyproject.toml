[project]
name = "finsight"
version = "0.1.0"
description = "FinSight - 금융데이터 수집·저장·시각화 (전 종목 일괄 수집·적재 배치)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "finance-datareader>=0.9.96",
    "numpy>=1.26",
    "pandas>=2.2",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "yfinance>=1.4.1",
    "streamlit>=1.58.0",
    "plotly>=6.8.0",
]

[dependency-groups]
dev = []

[tool.uv]
package = false
